[project]
name = "devinducky"
version = "0.1.0"
description = "Drive and watch Devin sessions from a duckyPad Pro"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.14", "httpx>=0.27", "pynput>=1.7",
    # Firefox tabs are read through the Accessibility API (pynput already pulls these in on macOS).
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.scripts]
devinducky = "devinducky.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
